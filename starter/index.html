<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flag Stories — Starter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery">
    <article class="poster chile-poster">
      <div class="poster-photo chile-photo"></div>
      <div class="flag_chile flag">
        <!-- Build Chile here with CSS Grid. Required: blue field, white field, red field, star. -->
         <div class="chile_white"></div>
         <div class="chile_red"></div>
         <div class="blue_square">
          <span class="star_chile">&#x2605;</span>
         </div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>South America</p><h1>CHILE</h1><small>Mountain / Coast</small></div>
    </article>
    <article class="poster denmark-poster">
      <div class="poster-photo denmark-photo"></div>
      <div class="flag_denmark flag">
        <!-- Build Denmark here with CSS Grid. Required: red field and white cross. -->
         <div class="red_denmark flag"></div>
            <div class="white_vertical"></div>
              <div class="white_horizontal">
            </div>
            <div class="white_horizontal2">

            </div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Scandinavia</p><h1>DENMARK</h1><small>North Sea / Light</small></div>
    </article>
    <article class="poster finland-poster">
      <div class="poster-photo finland-photo"></div>
      <div class="flag_finland flag">
        <!-- Build Finland here with CSS Grid. Required: white field and blue cross. -->
         <div class="white_background"> </div>
          <div class="blue_vertical"> </div>
            <div class="blue_horizontal">

            </div>
            <div class="blue_horizontal2"></div>
         
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Nordic Forests</p><h1>FINLAND</h1><small>Forest / Water</small></div>
    </article>
    <article class="poster car-poster">
      <div class="poster-photo car-photo"></div>
      <div class="flag_car flag">
        <!-- Build Central African Republic here with CSS Grid: blue, white, green, red, and yellow star. -->
         <div class="blue_stripe">
          <span class="star_car">&#x2605;</span>

         </div>
         <div class="white_stripe">

         </div>
         <div class="green_stripe">

         </div>
         <div class="yellow_stripe">

         </div>
         <div class="red_stripe"></div>
      </div>
      <div class="poster-overlay"></div>
      <div class="poster-text"><p>Central Africa</p><h1>C.A.R.</h1><small>River / Savanna</small></div>
    </article>
  </main>
</body>
</html>

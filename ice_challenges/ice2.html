<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="ice.css">
</head>
<body>
    <h1>Hello World</h1>
    <main>
    <table border="5px">
        <tr><!--Table Row-->
            <th>Other Thing</th><!--Table header-->
            <th></th>
        </tr>
        <tbody>
            <tr>
                <td colspan="2">Here is something</td>
                <td colspan="3">Another thing</td>
            </tr>
        </tbody>
    </table>
    <h2 id="beginning">This is the first one</h2><!--id is only used once-->
    <h2 class="end">This is the second one</h2>
    </main>
</body>
</html>
<!--putting *2 after a desired tag, it will replicate 2 of the same thing-->
